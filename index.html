<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
  <title>Tic-Tac-Toe</title>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
<h2 id="message">Message</h2>

<div class="input-container">
    <input type="text" id="player-x-name" placeholder="Player X Name">
    <input type="text" id="player-o-name" placeholder="Player O Name">
    <button type="submit" id="playerButton">Enter The Name</button>
    <button id="start-btn">Start Game</button>
</div>

<section class="board">
    <div class="sqr" id="0"></div>
    <div class="sqr" id="1"></div>
    <div class="sqr" id="2"></div>
    <div class="sqr" id="3"></div>
    <div class="sqr" id="4"></div>
    <div class="sqr" id="5"></div>
    <div class="sqr" id="6"></div>
    <div class="sqr" id="7"></div>
    <div class="sqr" id="8"></div>
</section>
<button id="restart-btn">Restart Game</button>
</body>
</html>
